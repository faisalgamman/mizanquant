# fly.toml app configuration file generated for mizanquant on 2026-06-20T21:07:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mizanquant'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = "8080"
  CACHE_DIR = "/data"      # persistent volume mount (see [[mounts]])
  # Speculation (Ross Cameron) shadow ledger — RESEARCH mode: measure the day-trade dream on the
  # real cheap-mover universe. NOT halal-screened (cheap gappers are mostly leveraged ETFs/crypto/
  # SPACs) and RVOL isn't in the Alpaca screener, so both gates are off; the 1-min Cameron pattern
  # stays the real entry gate. Paper only — never a real order, never a buy recommendation.
  SPEC_HALAL_ONLY = "false"
  SPEC_MIN_RVOL = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "60s"
    timeout = "30s"
    grace_period = "180s"
    method = "GET"
    path = "/health"

# Persistent disk for CACHE_DIR=/data (OHLCV/halal/screener warm caches, SQLite fallback, backups).
[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-4x"   # 4 shared vCPUs — the ~657-890-symbol screener scan (SCREENER_WORKERS
                           # threads) kept starving the asyncio event loop on 1x/2x → /health
                           # critical → 503. 4 cores leave the event loop a free core during scans.
  memory = "1024mb"        # bump to 2048 if you hit OOM; Railway's 2GB was a ceiling, not usage
