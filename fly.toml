# fly.toml app configuration file generated for mizanquant on 2026-06-20T21:07:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mizanquant'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  CACHE_DIR = '/data'
  PORT = '8080'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '2m0s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
