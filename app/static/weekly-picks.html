<!DOCTYPE html>
<html lang="en" dir="ltr" data-screen-label="Weekly Picks">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Picks — MizanQuant</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo-favicon.svg">
  <link rel="stylesheet" href="/static/fontawesome/all.min.css">
  <style>
    :root{
      --bg:#0c0c10; --surface:#14141a; --raised:#1c1c26; --border:rgba(255,255,255,.08);
      --txt:#e4e4ec; --txt2:#9494a0; --muted:#5c5c6a; --accent:#c8963e;
      --pos:#4ade80; --neg:#f87171; --warn:#fbbf24;
      --mono:ui-monospace,"JetBrains Mono",monospace;
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);
      font-family:"DM Sans",system-ui,sans-serif;font-size:13px}
    .wrap{max-width:1080px;margin:0 auto;padding:18px}
    .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .top .logo{font-weight:800;letter-spacing:.5px} .top .logo span{color:var(--accent)}
    .top a.back{margin-left:auto;color:var(--txt2);text-decoration:none;font-size:12px;
      border:1px solid var(--border);padding:5px 10px;border-radius:6px}
    h1{font-size:16px;margin:0 0 2px} .sub{color:var(--muted);font-size:11px;margin-bottom:14px}
    .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);
      border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:14px}
    .ctl{display:flex;flex-direction:column;gap:3px} .ctl label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
    .ctl input,.ctl select{background:var(--raised);border:1px solid var(--border);color:var(--txt);
      border-radius:6px;padding:7px 9px;font-size:12px;width:120px;outline:none}
    button.run{margin-left:auto;background:var(--accent);color:#1a1206;border:none;border-radius:6px;
      padding:9px 18px;font-weight:700;cursor:pointer;font-size:12px}
    button.run:disabled{opacity:.6;cursor:default}
    .banner{background:rgba(248,113,113,.10);border:1px solid var(--neg);color:var(--neg);
      border-radius:8px;padding:10px 12px;font-size:11.5px;line-height:1.5;margin-bottom:12px}
    .status{display:flex;flex-wrap:wrap;gap:18px;background:var(--surface);border:1px solid var(--border);
      border-radius:8px;padding:11px 14px;margin-bottom:12px;font-size:11.5px}
    .status .k{color:var(--muted)} .status b{color:var(--txt)}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
    th{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
    td.mono,th.mono{font-family:var(--mono)} .r{text-align:right}
    .pill{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px}
    .pill.sb{background:rgba(74,222,128,.15);color:var(--pos)} .pill.b{background:rgba(74,222,128,.10);color:var(--pos)}
    .empty{padding:34px;text-align:center;color:var(--muted)}
    .spin{display:inline-block;width:20px;height:20px;border:3px solid var(--border);
      border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;vertical-align:middle}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="logo">Mizan<span>Quant</span></span>
    <a class="back" href="/terminal"><i class="fas fa-arrow-left"></i> Terminal</a>
  </div>
  <h1>Weekly Swing Picks</h1>
  <div class="sub">Advisory · manual execution · Option-A exit (fixed 15% catastrophe stop + ~20 trading-day time exit). Not investment advice — validate on the paper track record before acting.</div>

  <div class="controls">
    <div class="ctl"><label>Account $</label><input id="account" type="number" value="10000" min="100"></div>
    <div class="ctl"><label>Top</label><input id="top" type="number" value="15" min="1" max="50"></div>
    <div class="ctl"><label>Min conf %</label><input id="minconf" type="number" value="45" min="0" max="100"></div>
    <div class="ctl"><label>Funnel</label><select id="funnel"><option value="pipeline">pipeline (USX V4)</option><option value="ready">ready (lighter)</option></select></div>
    <button class="run" id="runBtn" onclick="generate()">Generate</button>
  </div>

  <div id="out"><div class="empty">Click <b>Generate</b> to build this week's picks (full funnel can take 1–3 min).</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
let polling = null;

function fmt(n, d=2){ return (n==null||isNaN(n)) ? "—" : Number(n).toFixed(d); }

function render(rep){
  const grad = rep.graduation || {};
  const gradTxt = grad.graduated ? "GRADUATED" : ("NOT graduated — " + (grad.reason || "n/a"));
  const fp = rep.forward_pf;
  let fpTxt = "no matured signals yet";
  if (Array.isArray(fp) && fp.length){
    const f = fp[0];
    fpTxt = f.Message ? f.Message : ("win " + (f["Win Rate %"]??0) + "% · PF " + (f["Profit Factor"]??0) + " · n=" + (f["Total Signals"]??0));
  }
  const picks = rep.picks || [];
  let rows = picks.map((p,i)=>{
    const cls = p.verdict === "STRONG BUY" ? "sb" : "b";
    return `<tr>
      <td class="mono">${i+1}</td>
      <td><b>${p.symbol}</b></td>
      <td><span class="pill ${cls}">${p.verdict}</span></td>
      <td class="mono r">${fmt(p.confidence,0)}%</td>
      <td class="mono r">$${fmt(p.entry)}</td>
      <td class="mono r" style="color:var(--neg)">$${fmt(p.catastrophe_stop)}</td>
      <td class="mono r">${p.time_exit_date||"—"}</td>
      <td class="mono r">${p.shares??"—"}</td>
      <td class="mono r" style="color:var(--neg)">$${fmt(p.risk_amount)}</td>
      <td class="mono r">${p.votes||"—"}</td>
    </tr>`;
  }).join("");
  const table = picks.length ? `<table>
    <thead><tr><th class="mono">#</th><th>Symbol</th><th>Verdict</th><th class="r">Conf</th>
      <th class="r">Entry</th><th class="r">Stop −15%</th><th class="r">Exit ~20d</th>
      <th class="r">Shares</th><th class="r">Risk $</th><th class="r">Votes</th></tr></thead>
    <tbody>${rows}</tbody></table>`
    : `<div class="empty">No qualifying candidates this week.</div>`;

  $("out").innerHTML = `
    <div class="banner"><i class="fas fa-triangle-exclamation"></i> ${rep.advisory_banner || "Advisory only — manual execution."}</div>
    <div class="status">
      <span><span class="k">As of</span> <b>${rep.asof||"—"}</b></span>
      <span><span class="k">Account</span> <b>$${Number(rep.account||0).toLocaleString()}</b> · risk ${rep.risk_pct}% / cap ${rep.max_pos_pct}%</span>
      <span><span class="k">Forward-PF</span> <b>${fpTxt}</b></span>
      <span><span class="k">Graduation</span> <b style="color:${grad.graduated?'var(--pos)':'var(--warn)'}">${gradTxt}</b></span>
      <span><span class="k">${rep.market_note||""}</span></span>
    </div>
    ${table}`;
}

function building(){
  $("out").innerHTML = `<div class="empty"><span class="spin"></span><div style="margin-top:10px">Building report — scanning ~650 symbols (1–3 min). Auto-refreshing…</div></div>`;
}

async function fetchOnce(){
  const qs = new URLSearchParams({
    account: $("account").value || 10000,
    top: $("top").value || 15,
    min_confidence: $("minconf").value || 45,
    funnel: $("funnel").value || "pipeline",
  });
  const r = await fetch("/weekly_picks?" + qs.toString());
  return r.json();
}

async function tick(){
  try{
    const resp = await fetchOnce();
    // _serve_or_compute returns [{Status:"Building…"}] while computing.
    if (Array.isArray(resp)){
      if (resp[0] && (resp[0].Status || resp[0].Error)){ building(); return false; }
      return false;
    }
    if (resp && resp.error){ $("out").innerHTML = `<div class="empty">Error: ${resp.error}</div>`; return true; }
    if (resp && resp.picks !== undefined){ render(resp); return true; }
    building(); return false;
  }catch(e){ $("out").innerHTML = `<div class="empty">Request failed: ${e}</div>`; return true; }
}

async function generate(){
  if (polling) clearInterval(polling);
  $("runBtn").disabled = true;
  building();
  const done = await tick();
  if (!done){
    polling = setInterval(async ()=>{ if (await tick()){ clearInterval(polling); polling=null; $("runBtn").disabled=false; } }, 15000);
  } else { $("runBtn").disabled = false; }
}
</script>
</body>
</html>
