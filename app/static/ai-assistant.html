<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/fontawesome/all.min.css">
<link rel="stylesheet" href="/static/design-tokens.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant — MizanQuant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-root:        #0c0c10;
  --bg-surface:     #14141a;
  --bg-raised:      #1c1c26;
  --bg-overlay:     #242430;
  --bg:             #0c0c10;
  --surface:        #14141a;
  --card:           #1c1c26;
  --bg-card:        #1c1c26;
  --bg-hover:       #242430;
  --surface-raised: #1c1c26;
  --border-subtle:  rgba(255, 255, 255, 0.04);
  --border-default: rgba(255, 255, 255, 0.06);
  --border-strong:  rgba(255, 255, 255, 0.10);
  --border:         rgba(255, 255, 255, 0.06);
  --border-light:   rgba(255, 255, 255, 0.04);
  --border-hi:      rgba(255, 255, 255, 0.10);
  --text-primary:   #e4e4ec;
  --text-secondary: #9494a0;
  --text-muted:     #5c5c6a;
  --text-disabled:  #3c3c48;
  --text:           #e4e4ec;
  --txt:            #e4e4ec;
  --txt2:           #9494a0;
  --txt3:           #5c5c6a;
  --muted:          #5c5c6a;
  --accent:         #c8963e;
  --accent-hover:   #d4a853;
  --accent-dim:     rgba(200, 150, 62, 0.10);
  --accent-glow:    rgba(200, 150, 62, 0.18);
  --positive:       #4ade80;
  --positive-dim:   rgba(74, 222, 128, 0.10);
  --negative:       #f87171;
  --negative-dim:   rgba(248, 113, 113, 0.10);
  --warning:        #fbbf24;
  --warning-dim:    rgba(251, 191, 36, 0.10);
  --info:           #60a5fa;
  --info-dim:       rgba(96, 165, 250, 0.10);
  --green:          #4ade80;
  --green-dim:      rgba(74, 222, 128, 0.10);
  --red:            #f87171;
  --red-dim:        rgba(248, 113, 113, 0.10);
  --yellow:         #fbbf24;
  --amber:          #fbbf24;
  --amber-dim:      rgba(251, 191, 36, 0.10);
  --orange:         #fb923c;
  --gold:           #c8963e;
  --accent-green:   #4ade80;
  --accent-red:     #f87171;
  --accent-orange:  #fb923c;
  --accent-purple:  #a78bfa;
  --accent2:        #a78bfa;
  --fam-transformer: #eab308;
  --fam-rnn:         #a855f7;
  --fam-lstm:        var(--accent);
  --fam-cnn:         #06b6d4;
  --fam-ensemble:    #22c55e;
  --fam-classic:     #64748b;
  --font-display: 'DM Sans', system-ui, -apple-system, sans-serif;
  --font-body:    system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:    'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, monospace;
  --font-arabic:  'Cairo', 'Tahoma', 'Geeza Pro', system-ui, sans-serif;
  --mono:         'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, monospace;
  --text-xs:   0.625rem;
  --text-sm:   0.75rem;
  --text-base: 0.8125rem;
  --text-md:   0.9375rem;
  --text-lg:   1.125rem;
  --text-xl:   1.375rem;
  --text-2xl:  1.625rem;
  --radius-sm: 3px;
  --radius-md: 5px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius:    5px;
  --r:         5px;
  --ease-out:        cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out:     cubic-bezier(0.65, 0, 0.35, 1);
  --duration-fast:   120ms;
  --duration-normal: 200ms;
  --duration-slow:   350ms;
  --sidebar-w:  56px;
  --cmd-h:      48px;
  --market-h:   36px;
  --status-h:   28px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font: 13px/1.5 var(--font-body); background: var(--bg); color: var(--text); padding: 20px; height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-shrink: 0; }
.header h1 { font-size: 22px; font-weight: 600; }
.header h1 span { color: var(--accent); }
.refresh-btn { background: var(--accent); color: #fff; border: none; padding: 8px 20px; border-radius: var(--radius); cursor: pointer; font-size: 13px; }
.refresh-btn:hover { opacity: .85; }

/* Tab bar */
.tab-bar { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.tab-btn { padding: 10px 20px; background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { display: none; flex: 1; min-height: 0; }
.tab-content.active { display: block; }

/* === Report Tab === */
.report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; height: 100%; }
.report-panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; overflow-y: auto; }
.report-panel h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--accent); }
.report-text { font-size: 13px; line-height: 1.6; white-space: pre-wrap; color: var(--text); }
.report-text .empty { color: var(--muted); font-style: italic; }
.controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.controls select, .controls input, .controls button { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: 13px; }
.controls button { background: var(--accent); color: #fff; cursor: pointer; border: none; }
.controls button:hover { opacity: .85; }
.controls button:disabled { opacity: .5; cursor: not-allowed; }

/* === Chat Tab === */
.chat-container { display: flex; flex-direction: column; height: 100%; }
.chat-messages { flex: 1; overflow-y: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 12px; }
.chat-msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.6; }
.chat-msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.chat-msg.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.chat-msg .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
.chat-msg.assistant .meta { color: var(--muted); }
.chat-msg .llm-badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--surface); margin-left: 6px; }
.chat-input-row { display: flex; gap: 8px; margin-top: 12px; }
.chat-input-row input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: 13px; }
.chat-input-row input:focus { outline: none; border-color: var(--accent); }
.chat-input-row button { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; font-size: 13px; }
.chat-input-row button:hover { opacity: .85; }
.chat-input-row button:disabled { opacity: .5; cursor: not-allowed; }
.suggestions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.suggestions button { padding: 4px 12px; border: 1px solid var(--border); border-radius: 12px; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; }
.suggestions button:hover { color: var(--text); border-color: var(--muted); }

/* Consensus widget */
.consensus-widget { background: var(--surface); border-radius: var(--radius); padding: 12px; margin-top: 12px; }
.consensus-widget .header { font-size: 12px; font-weight: 500; margin-bottom: 8px; color: var(--muted); }
.consensus-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
.consensus-bar .up { background: var(--green); }
.consensus-bar .down { background: var(--red); }
.consensus-bar .neutral { background: var(--muted); }
.consensus-row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
.consensus-row .model { color: var(--muted); }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--muted); }
.loading .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Responsive */
@media (max-width: 768px) { .report-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="header">
  <h1><span>AI</span> Assistant</h1>
  <a href="/" style="padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius);color:var(--muted);text-decoration:none;font-size:13px;">← Dashboard</a>
</div>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="report">Investment Report</button>
  <button class="tab-btn" data-tab="chat">Ask AI</button>
  <button class="tab-btn" data-tab="consensus">Model Consensus</button>
</div>

<!-- === Tab: Report === -->
<div class="tab-content active" id="tab-report">
  <div class="controls">
    <select id="reportMinScore">
      <option value="70">Min Score: 70</option>
      <option value="60">Min Score: 60</option>
      <option value="80">Min Score: 80</option>
    </select>
    <select id="reportMaxResults">
      <option value="8">Max Results: 8</option>
      <option value="5">Max Results: 5</option>
      <option value="15">Max Results: 15</option>
    </select>
    <button onclick="loadReport()">⟳ Generate Report</button>
  </div>
  <div class="loading" id="loadingReport" style="display:none;">
    <div class="spinner"></div>
    Generating report...
  </div>
  <div class="report-grid" id="reportGrid" style="display:none;">
    <div class="report-panel" id="reportContentPanel">
      <h3>📋 AI Report</h3>
      <div class="report-text" id="reportText">Click "Generate Report" to start</div>
    </div>
    <div class="report-panel">
      <h3>📊 Top Opportunities</h3>
      <div id="reportOpportunities"></div>
    </div>
  </div>
</div>

<!-- === Tab: Chat === -->
<div class="tab-content" id="tab-chat">
  <div class="chat-container">
    <div class="suggestions">
      <button onclick="quickAsk('What is the best stock to buy right now?')">Best stock to buy?</button>
      <button onclick="quickAsk('Analyze AAPL for halal investment')">Analyze AAPL</button>
      <button onclick="quickAsk('What is the market outlook?')">Market outlook</button>
      <button onclick="quickAsk('Explain the scoring system')">Scoring system</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-msg assistant">
        👋 Ask me anything about stocks, halal investing, or market analysis.
        <div class="meta">AI Assistant</div>
      </div>
    </div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Ask about a stock or strategy..." onkeydown="if(event.key==='Enter') sendChat()">
      <button onclick="sendChat()">Send</button>
    </div>
  </div>
</div>

<!-- === Tab: Consensus === -->
<div class="tab-content" id="tab-consensus">
  <div class="controls">
    <input type="text" id="consSymbol" value="AAPL" placeholder="Symbol" style="width:100px;">
    <button onclick="loadConsensus()">⟳ Load Consensus</button>
    <span id="consStatus" style="color:var(--muted);font-size:12px;"></span>
  </div>
  <div class="loading" id="loadingConsensus" style="display:none;">
    <div class="spinner"></div>
    Running 14-model ensemble...
  </div>
  <div id="consensusContent" style="display:none;">
    <div class="consensus-widget" id="consensusWidget"></div>
    <div class="report-panel" style="margin-top:14px;max-height:500px;overflow-y:auto;" id="consensusModels"></div>
  </div>
</div>

<script>
const API = '';

// === Tab switching ===
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

async function apiGet(path) {
  try {
    const res = await fetch(API + path, { signal: AbortSignal.timeout(30000) });
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

function now() { return new Date().toISOString(); }
function timeAgo(ts) {
  if (!ts) return '';
  const sec = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (sec < 60) return sec + 's ago';
  if (sec < 3600) return Math.floor(sec/60) + 'm ago';
  return Math.floor(sec/3600) + 'h ago';
}

// === Report ===
async function loadReport() {
  document.getElementById('loadingReport').style.display = '';
  document.getElementById('reportGrid').style.display = 'none';
  const minScore = document.getElementById('reportMinScore').value;
  const maxResults = document.getElementById('reportMaxResults').value;
  const data = await apiGet(`/api/ai/report?min_score=${minScore}&max_results=${maxResults}&use_cache=false`);
  document.getElementById('loadingReport').style.display = 'none';
  if (!data) {
    document.getElementById('reportText').textContent = 'Failed to generate report';
    document.getElementById('reportGrid').style.display = '';
    return;
  }
  document.getElementById('reportText').innerHTML = data.report ? data.report.replace(/\n/g, '<br>') : '<span class="empty">No report content available</span>';
  document.getElementById('reportGrid').style.display = '';
  // LLM badge
  document.getElementById('reportContentPanel').querySelector('h3').innerHTML = `📋 AI Report ${data.llm_used ? '<span class="llm-badge" style="display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:var(--surface);margin-left:6px;color:var(--yellow)">LLM</span>' : '<span class="llm-badge" style="display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:var(--surface);margin-left:6px;color:var(--muted)">Proxy</span>'}`;
  // Opportunities placeholder
  const oppEl = document.getElementById('reportOpportunities');
  if (data.opportunities != null) {
    oppEl.innerHTML = `<div style="text-align:center;padding:30px;"><div style="font-size:36px;font-weight:700;color:var(--green);">${data.opportunities}</div><div style="color:var(--muted);margin-top:4px;">Opportunities Found</div></div>`;
  } else {
    oppEl.innerHTML = '<div class="empty-state" style="padding:20px;"><div class="icon">📊</div>No data</div>';
  }
}

// === Chat ===
async function sendChat() {
  const input = document.getElementById('chatInput');
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  const msgDiv = document.getElementById('chatMessages');
  msgDiv.innerHTML += `<div class="chat-msg user">${escapeHtml(q)}<div class="meta">You</div></div>`;
  msgDiv.scrollTop = msgDiv.scrollHeight;
  const loadingId = 'loading-' + Date.now();
  msgDiv.innerHTML += `<div class="chat-msg assistant" id="${loadingId}"><div class="spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;margin-right:8px;"></div> Thinking...</div>`;
  const data = await apiGet(`/api/ai/ask?question=${encodeURIComponent(q)}`);
  document.getElementById(loadingId)?.remove();
  if (!data || !data.answer) {
    msgDiv.innerHTML += `<div class="chat-msg assistant">Sorry, I couldn't process that request.<div class="meta">AI Assistant</div></div>`;
  } else {
    msgDiv.innerHTML += `<div class="chat-msg assistant">${escapeHtml(data.answer).replace(/\n/g, '<br>')}<div class="meta">AI Assistant${data.llm_used ? ' <span class="llm-badge">LLM</span>' : ' <span class="llm-badge">Proxy</span>'}</div></div>`;
  }
  msgDiv.scrollTop = msgDiv.scrollHeight;
}

function quickAsk(q) {
  document.getElementById('chatInput').value = q;
  sendChat();
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// === Consensus ===
async function loadConsensus() {
  const sym = document.getElementById('consSymbol').value.trim().toUpperCase() || 'AAPL';
  document.getElementById('consStatus').textContent = 'Loading...';
  document.getElementById('loadingConsensus').style.display = '';
  document.getElementById('consensusContent').style.display = 'none';
  const data = await apiGet(`/api/consensus?symbol=${sym}&accuracy_threshold=55`);
  document.getElementById('loadingConsensus').style.display = 'none';
  if (!data) {
    document.getElementById('consStatus').textContent = 'Failed to load';
    return;
  }
  document.getElementById('consStatus').textContent = `Updated ${timeAgo(data.timestamp || now())}`;
  document.getElementById('consensusContent').style.display = '';

  const widget = document.getElementById('consensusWidget');
  const up = data.up_votes || 0;
  const down = data.down_votes || 0;
  const total = data.total_models || (up + down);
  const neutral = total - up - down;
  const upPct = total > 0 ? (up / total * 100) : 0;
  const downPct = total > 0 ? (down / total * 100) : 0;
  const neutralPct = total > 0 ? (neutral / total * 100) : 0;

  widget.innerHTML = `
    <div class="header">${sym.toUpperCase()} — ${data.recommendation || 'N/A'} (${data.confidence || '0/0'})</div>
    <div style="font-size:24px;font-weight:700;margin-bottom:6px;" class="${(data.recommendation||'').startsWith('BUY') ? 'text-green' : (data.recommendation||'').startsWith('SELL') ? 'text-red' : ''}">${data.recommendation || 'N/A'}</div>
    <div class="consensus-bar">
      <div class="up" style="width:${Math.max(upPct, 2)}%"></div>
      <div class="neutral" style="width:${Math.max(neutralPct, 2)}%"></div>
      <div class="down" style="width:${Math.max(downPct, 2)}%"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;">
      <span style="color:var(--green)">▲ ${up} Up</span>
      <span style="color:var(--muted)">— ${neutral} Neutral</span>
      <span style="color:var(--red)">▼ ${down} Down</span>
    </div>
    <div class="consensus-row"><span>Qualified Models</span><span>${data.qualified_models || 0} / ${data.total_models || 0}</span></div>
    <div class="consensus-row"><span>Threshold</span><span>>${data.accuracy_threshold || 55}% accuracy</span></div>
  `;

  const modelsEl = document.getElementById('consensusModels');
  if (data.model_votes && data.model_votes.length) {
    let html = `<table style="width:100%;border-collapse:collapse;font-size:12px;">
      <thead><tr><th>Model</th><th>Direction</th><th>Accuracy</th><th>R²</th><th>MAPE</th></tr></thead><tbody>`;
    for (const m of data.model_votes) {
      const dir = (m.direction || '').toLowerCase();
      html += `<tr>
        <td>${m.model || '—'}</td>
        <td class="${dir === 'up' ? 'text-green' : dir === 'down' ? 'text-red' : ''}" style="font-weight:500;">${(m.direction || '—').toUpperCase()}</td>
        <td>${m.accuracy_pct != null ? m.accuracy_pct.toFixed(1)+'%' : '—'}</td>
        <td>${m.r2 != null ? m.r2.toFixed(3) : '—'}</td>
        <td>${m.mape != null ? m.mape.toFixed(2)+'%' : '—'}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    modelsEl.innerHTML = html;
  } else {
    modelsEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);">No model votes available</div>';
  }
}

// Load defaults
loadConsensus();
</script>
<script src="/static/ecosystem-strip.js" defer></script>
</body>
</html>
