<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halal Screener — MizanQuant</title>
<style>
:root {
  --bg: #0b0e14; --surface: #131820; --card: #1a212e; --border: #2a3348;
  --text: #e2e8f0; --muted: #8892a8; --accent: #3b82f6; --green: #22c55e;
  --red: #ef4444; --yellow: #eab308; --orange: #f97316; --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font: 14px/1.5 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
.header h1 { font-size: 22px; font-weight: 600; }
.header h1 span { color: var(--green); }
.last-updated { color: var(--muted); font-size: 12px; }
.refresh-btn { background: var(--accent); color: #fff; border: none; padding: 8px 20px; border-radius: var(--radius); cursor: pointer; font-size: 13px; }
.refresh-btn:hover { opacity: .85; }
.refresh-btn:disabled { opacity: .5; cursor: not-allowed; }

/* Controls */
.controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.controls select, .controls input, .controls button { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: 13px; }
.controls button.primary { background: var(--green); color: #000; border: none; cursor: pointer; font-weight: 500; }
.controls button.primary:hover { opacity: .85; }
.controls button.primary:disabled { opacity: .5; cursor: not-allowed; }
.controls .count-badge { color: var(--muted); font-size: 13px; }

/* Progress bar */
.progress-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; display: none; }
.progress-wrap .label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.progress-bar { height: 6px; background: var(--surface); border-radius: 3px; overflow: hidden; }
.progress-bar .fill { height: 100%; background: var(--green); border-radius: 3px; transition: width .3s; width: 0%; }

/* Summary bar */
.summary-bar { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
.summary-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; text-align: center; }
.summary-card .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.summary-card .value { font-size: 20px; font-weight: 700; margin-top: 4px; }

/* Gate info */
.gate-info { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.gate-badge { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.gate-riskon { background: #22c55e22; color: var(--green); border: 1px solid var(--green); }
.gate-caution { background: #eab30822; color: var(--yellow); border: 1px solid var(--yellow); }
.gate-credit { background: #f9731622; color: var(--orange); border: 1px solid var(--orange); }
.gate-extreme { background: #ef444422; color: var(--red); border: 1px solid var(--red); }

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { background: var(--surface); color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; position: sticky; top: 0; z-index: 2; }
tr:hover td { background: #ffffff08; }
tr.selected td { background: #3b82f622; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--text); }
th.sortable::after { content: ' ↕'; font-size: 10px; opacity: .4; }
th.sortable.asc::after { content: ' ↑'; opacity: 1; }
th.sortable.desc::after { content: ' ↓'; opacity: 1; }

/* Score bar */
.score-bar { display: inline-flex; align-items: center; gap: 4px; }
.score-fill { height: 6px; border-radius: 3px; min-width: 2px; }
.score-text { font-weight: 600; }

/* Halal badge */
.halal-yes { color: var(--green); font-weight: 600; }
.halal-no { color: var(--red); font-weight: 600; }
.halal-unknown { color: var(--muted); }

/* Signal */
.signal-buy { color: var(--green); font-weight: 600; }
.signal-wait { color: var(--yellow); font-weight: 600; }
.signal-avoid { color: var(--red); font-weight: 600; }

/* Side panel */
.side-panel { position: fixed; top: 0; right: -480px; width: 460px; height: 100%; background: var(--card); border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; transition: right .25s; z-index: 100; }
.side-panel.open { right: 0; }
.side-panel .close-btn { float: right; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
.side-panel .close-btn:hover { color: var(--text); }
.side-panel h2 { font-size: 18px; margin-bottom: 16px; }
.side-panel .detail-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
.side-panel .detail-row .label { color: var(--muted); }
.side-panel .detail-row .value { font-weight: 500; }

/* Loading / empty / error */
.loading { text-align: center; padding: 60px; color: var(--muted); }
.loading .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 60px; color: var(--muted); }
.empty-state .icon { font-size: 40px; margin-bottom: 8px; }

/* Filters bar */
.filters-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.filters-bar input, .filters-bar select { padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: 12px; }
.filters-bar input { width: 120px; }

/* Export */
.export-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-size: 12px; }
.export-btn:hover { color: var(--text); }

/* Responsive table count */
.result-count { font-size: 13px; color: var(--muted); margin-bottom: 8px; }

/* Overlay */
.overlay { display: none; position: fixed; inset: 0; background: #00000060; z-index: 99; }
.overlay.show { display: block; }
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closePanel()"></div>

<div class="header">
  <div>
    <h1><span>Halal</span> Screener</h1>
    <div class="last-updated" id="lastUpdated">Ready</div>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="export-btn" onclick="exportCSV()">⬇ Export CSV</button>
    <button class="refresh-btn" id="scanBtn" onclick="startScan()">▶ Run Smart Scan</button>
  </div>
</div>

<!-- Progress -->
<div class="progress-wrap" id="progressWrap">
  <div class="label"><span id="progressLabel">Scanning...</span><span id="progressPct">0%</span></div>
  <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
</div>

<!-- Summary -->
<div class="summary-bar" id="summaryBar"></div>

<!-- Gate & Market Info -->
<div class="gate-info" id="gateInfo"></div>

<!-- Filters -->
<div class="filters-bar" id="filtersBar">
  <input type="text" id="filterSymbol" placeholder="Symbol..." oninput="filterTable()">
  <select id="filterSignal" onchange="filterTable()">
    <option value="">All Signals</option>
    <option value="BUY">BUY</option>
    <option value="WAIT">WAIT</option>
    <option value="AVOID">AVOID</option>
  </select>
  <select id="filterScore" onchange="filterTable()">
    <option value="0">Min Score: Any</option>
    <option value="70">Min Score: 70+</option>
    <option value="80">Min Score: 80+</option>
    <option value="90">Min Score: 90+</option>
  </select>
  <input type="text" id="filterSector" placeholder="Sector..." oninput="filterTable()">
  <select id="sortBy" onchange="renderTable()">
    <option value="smart_score">Sort: Score</option>
    <option value="change_pct">Sort: Change %</option>
    <option value="market_cap">Sort: Market Cap</option>
    <option value="symbol">Sort: Symbol</option>
  </select>
  <span class="count-badge" id="countBadge">0 results</span>
</div>

<!-- Table -->
<div class="loading" id="loadingScreen">
  <div class="spinner"></div>
  <span id="loadingText">Loading screener data...</span>
</div>
<div id="tableWrap" style="display:none;">
  <div class="result-count" id="resultCount"></div>
  <div class="table-wrap" id="tableContainer"></div>
</div>
<div class="empty-state" id="emptyState" style="display:none;">
  <div class="icon">🔍</div>
  <div>No results found. Click "Run Smart Scan" to start.</div>
</div>

<!-- Side Panel -->
<div class="side-panel" id="sidePanel">
  <button class="close-btn" onclick="closePanel()">✕</button>
  <h2 id="panelTitle">Symbol Details</h2>
  <div id="panelContent"></div>
</div>

<script>
const API = '';
let allResults = [];
let filteredResults = [];
let sortField = 'smart_score';
let sortAsc = false;
let scanInterval = null;

const SUM_API = '/api/stock/summary?symbol=';
const HALAL_API = '/api/halal-status?symbol=';
const SCREENER_API = '/api/stock/smart-screener';

async function apiGet(path) {
  try {
    const res = await fetch(API + path, { signal: AbortSignal.timeout(30000) });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { console.warn('API error:', path, e); return null; }
}

function fmt(val) {
  if (val == null) return '—';
  if (typeof val === 'number') return val.toLocaleString();
  return val;
}
function fmtPct(val) {
  if (val == null || isNaN(val)) return '—';
  return parseFloat(val).toFixed(2) + '%';
}
function fmtScore(val) { return val != null ? val : '—'; }

function scoreColor(s) {
  if (s >= 80) return 'var(--green)';
  if (s >= 60) return 'var(--yellow)';
  if (s >= 40) return 'var(--orange)';
  return 'var(--red)';
}
function scoreBg(s) {
  if (s >= 80) return '#22c55e';
  if (s >= 60) return '#eab308';
  if (s >= 40) return '#f97316';
  return '#ef4444';
}

// === Scan ===
async function startScan() {
  document.getElementById('scanBtn').disabled = true;
  document.getElementById('scanBtn').textContent = '⟳ Scanning...';
  document.getElementById('loadingScreen').style.display = '';
  document.getElementById('loadingText').textContent = 'Starting scan...';
  document.getElementById('tableWrap').style.display = 'none';
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('progressWrap').style.display = '';

  // Start progress polling
  if (scanInterval) clearInterval(scanInterval);
  scanInterval = setInterval(pollProgress, 2000);

  const data = await apiGet(SCREENER_API + '?use_cache=false&max_results=50&add_forecast=true');
  if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
  document.getElementById('progressWrap').style.display = 'none';

  if (!data) {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('emptyState').style.display = '';
    document.getElementById('emptyState').querySelector('div:last-child').textContent = 'Failed to load screener data';
    document.getElementById('scanBtn').disabled = false;
    document.getElementById('scanBtn').textContent = '▶ Run Smart Scan';
    return;
  }

  if (data.status === 'scanning' || data.source === 'scanning') {
    // Still scanning — poll again
    document.getElementById('loadingText').textContent = data.message || 'Scanning in progress...';
    setTimeout(startScan, 5000);
    return;
  }

  document.getElementById('loadingScreen').style.display = 'none';
  allResults = data.results || [];
  renderSummary(data);
  renderGateInfo(data);
  renderTable();
  document.getElementById('scanBtn').disabled = false;
  document.getElementById('scanBtn').textContent = '▶ Run Smart Scan';
  updateTimestamp(data);
}

async function pollProgress() {
  const p = await apiGet('/api/screener/progress');
  if (!p) return;
  const pct = Math.min(p.pct || 0, 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct.toFixed(0) + '%';
  document.getElementById('progressLabel').textContent = `Scanning ${p.current || 0} / ${p.total || '?'} symbols`;
  if (p.status === 'done' || p.status === 'idle') {
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressPct').textContent = '100%';
    if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
  }
}

// === Summary ===
function renderSummary(data) {
  const el = document.getElementById('summaryBar');
  const items = [
    { label: 'Total Scanned', value: data.total_scanned || 0 },
    { label: 'Halal', value: data.halal_count || 0, cls: 'text-green' },
    { label: 'Qualified', value: data.qualified_count || 0, cls: 'text-green' },
    { label: 'Watch List', value: data.watch_count || 0, cls: data.watch_count > 0 ? 'text-yellow' : '' },
    { label: 'Results', value: data.results_count || (allResults.length) },
    { label: 'Min Gate', value: data.min_score || 50, cls: 'text-yellow' },
    { label: 'Strong Gate', value: data.strong_gate || 65, cls: 'text-green' },
  ];
  el.innerHTML = items.map(i => `<div class="summary-card"><div class="label">${i.label}</div><div class="value ${i.cls||''}">${i.value}</div></div>`).join('');
}

function renderGateInfo(data) {
  const el = document.getElementById('gateInfo');
  let cls = 'gate-riskon';
  let label = data.market_status || 'RISK ON';
  const ms = (data.market_status || '').toUpperCase();
  if (ms.includes('CAUTION')) cls = 'gate-caution';
  else if (ms.includes('CREDIT') || ms.includes('STRESS')) cls = 'gate-credit';
  else if (ms.includes('EXTREME') || ms.includes('FEAR')) cls = 'gate-extreme';
  el.innerHTML = `
    <span class="gate-badge ${cls}">${data.market_status || 'RISK ON'}</span>
    <span class="gate-badge" style="background:var(--surface);border-color:var(--border);color:var(--muted);">Regime: ${data.regime || '—'}</span>
    <span class="gate-badge" style="background:var(--surface);border-color:var(--border);color:var(--muted);">Min Gate: ${data.min_score || 50}</span>
    <span class="gate-badge" style="background:var(--surface);border-color:var(--border);color:var(--muted);">Strong Gate: ${data.strong_gate || 65}</span>
    ${data.halt_pipeline ? '<span class="gate-badge" style="background:var(--red);color:#fff;border:none;">PIPELINE HALTED</span>' : ''}
  `;
}

// === Table ===
function renderTable() {
  sortField = document.getElementById('sortBy').value;
  filteredResults = [...allResults].filter(r => {
    if (document.getElementById('filterSymbol').value) {
      const q = document.getElementById('filterSymbol').value.toUpperCase();
      if (!r.symbol.toUpperCase().includes(q)) return false;
    }
    const sig = document.getElementById('filterSignal').value;
    if (sig && (r.signal || '').toUpperCase() !== sig) return false;
    const minScore = parseInt(document.getElementById('filterScore').value);
    if (minScore && (r.smart_score || 0) < minScore) return false;
    if (document.getElementById('filterSector').value) {
      const q = document.getElementById('filterSector').value.toLowerCase();
      if (!(r.sector || '').toLowerCase().includes(q)) return false;
    }
    return true;
  });

  filteredResults.sort((a, b) => {
    let va = a[sortField] ?? 0;
    let vb = b[sortField] ?? 0;
    if (typeof va === 'string') va = va.toUpperCase();
    if (typeof vb === 'string') vb = vb.toUpperCase();
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });

  document.getElementById('countBadge').textContent = filteredResults.length + ' results';
  document.getElementById('resultCount').textContent = `Showing ${filteredResults.length} of ${allResults.length} results`;

  const el = document.getElementById('tableContainer');
  if (filteredResults.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><div>No matching results</div></div>';
    document.getElementById('tableWrap').style.display = '';
    return;
  }

  let html = `<table><thead><tr>
    <th class="sortable" onclick="toggleSort('symbol')">Symbol</th>
    <th class="sortable" onclick="toggleSort('smart_score')">Score</th>
    <th>Halal</th>
    <th class="sortable" onclick="toggleSort('change_pct')">Chg %</th>
    <th class="sortable" onclick="toggleSort('market_cap')">Mkt Cap</th>
    <th>Sector</th>
    <th>RS</th>
    <th>Volume</th>
    <th>ADX</th>
    <th>Signal</th>
    <th>Strategy</th>
  </tr></thead><tbody>`;

  for (const r of filteredResults) {
    const md = r.momentum_details || {};
    html += `<tr onclick="openPanel('${r.symbol}')" style="cursor:pointer;">
      <td><strong>${r.symbol}</strong></td>
      <td><div class="score-bar"><div class="score-fill" style="width:${(r.smart_score||0)/100*40}px;background:${scoreBg(r.smart_score)}"></div><span class="score-text" style="color:${scoreColor(r.smart_score)}">${fmtScore(r.smart_score)}</span></div></td>
      <td class="${r.is_halal ? 'halal-yes' : 'halal-no'}">${r.is_halal ? '✓' : '✗'}</td>
      <td class="${(r.change_pct||0) >= 0 ? 'text-green' : 'text-red'}">${fmtPct(r.change_pct)}</td>
      <td>${r.market_cap ? '$' + (r.market_cap/1e9).toFixed(1)+'B' : '—'}</td>
      <td style="max-width:100px;overflow:hidden;text-overflow:ellipsis;">${r.sector || '—'}</td>
      <td>${md.rsi != null ? md.rsi.toFixed(0) : '—'}</td>
      <td>${md.volume_ratio != null ? (md.volume_ratio*100).toFixed(0)+'%' : '—'}</td>
      <td>${md.adx != null ? md.adx.toFixed(0) : '—'}</td>
      <td class="${sigClass(r.signal)}">${r.signal || '—'}</td>
      <td style="font-size:11px;">${r.strategy || '—'}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  el.innerHTML = html;
}

function filterTable() { renderTable(); }
function toggleSort(field) {
  if (sortField === field) sortAsc = !sortAsc;
  else { sortField = field; sortAsc = false; }
  document.getElementById('sortBy').value = field;
  renderTable();
}

function sigClass(s) {
  if (!s) return '';
  const u = s.toUpperCase();
  if (u === 'BUY') return 'signal-buy';
  if (u === 'WAIT') return 'signal-wait';
  if (u === 'AVOID') return 'signal-avoid';
  return '';
}

function updateTimestamp(data) {
  document.getElementById('lastUpdated').textContent = data.source ? `Source: ${data.source} | ${new Date().toLocaleTimeString()}` : new Date().toLocaleTimeString();
}

// === Side Panel ===
async function openPanel(symbol) {
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sidePanel').classList.add('open');
  document.getElementById('panelTitle').textContent = symbol + ' — Details';
  document.getElementById('panelContent').innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

  const [summary, halal, result] = await Promise.all([
    apiGet(SUM_API + symbol),
    apiGet(HALAL_API + symbol),
    Promise.resolve(allResults.find(r => r.symbol === symbol) || null),
  ]);

  const dc = summary || {};
  const hc = halal || {};
  const rc = result || {};

  const md = rc.momentum_details || {};
  const fd = rc.fundamental_details || {};

  let html = '';

  // Score bar
  if (rc.smart_score != null) {
    html += `<div style="text-align:center;padding:16px;margin-bottom:16px;background:var(--surface);border-radius:var(--radius);">
      <div style="font-size:36px;font-weight:700;color:${scoreColor(rc.smart_score)}">${rc.smart_score}</div>
      <div style="font-size:12px;color:var(--muted);">Smart Score</div>
    </div>`;
  }

  // Halal card
  html += `<div style="margin-bottom:16px;padding:12px;background:var(--surface);border-radius:var(--radius);">
    <div style="font-size:16px;font-weight:600;margin-bottom:8px;color:${hc.is_halal ? 'var(--green)' : 'var(--red)'}">${hc.is_halal ? '✓ HALAL — ' + (hc.status||'Compliant') : '✗ NON-COMPLIANT'}</div>
    <div class="detail-row"><span class="label">Debt Ratio</span><span class="value">${fmtPct(hc.debt_ratio)} ${hc.debt_pass ? '✓' : '✗'}</span></div>
    <div class="detail-row"><span class="label">Interest Ratio</span><span class="value">${fmtPct(hc.interest_ratio)} ${hc.interest_pass ? '✓' : '✗'}</span></div>
    <div class="detail-row"><span class="label">Screens</span><span class="value">${hc.screens_passed || 0} / ${hc.screens_total || 4}</span></div>
  </div>`;

  // Company info
  html += `<div style="margin-bottom:12px;">
    <div class="detail-row"><span class="label">Company</span><span class="value">${dc.company_name || rc.company || '—'}</span></div>
    <div class="detail-row"><span class="label">Sector</span><span class="value">${dc.sector || rc.sector || '—'}</span></div>
    <div class="detail-row"><span class="label">Industry</span><span class="value">${dc.industry || rc.industry || '—'}</span></div>
    <div class="detail-row"><span class="label">Price</span><span class="value">${dc.price != null ? '$'+dc.price.toFixed(2) : (rc.price ? '$'+rc.price : '—')}</span></div>
    <div class="detail-row"><span class="label">Market Cap</span><span class="value">${dc.market_cap ? '$'+(dc.market_cap/1e9).toFixed(2)+'B' : (rc.market_cap ? '$'+(rc.market_cap/1e9).toFixed(2)+'B' : '—')}</span></div>
    <div class="detail-row"><span class="label">Signal</span><span class="value ${sigClass(rc.signal)}">${rc.signal || '—'}</span></div>
    <div class="detail-row"><span class="label">Strategy</span><span class="value">${rc.strategy || '—'}</span></div>
  </div>`;

  // Momentum
  html += `<h3 style="font-size:14px;font-weight:600;margin-bottom:8px;color:var(--accent);">Momentum</h3>`;
  html += `<div class="detail-row"><span class="label">RSI</span><span class="value">${md.rsi != null ? md.rsi.toFixed(1) : '—'}</span></div>`;
  html += `<div class="detail-row"><span class="label">MACD</span><span class="value">${md.macd || '—'}</span></div>`;
  html += `<div class="detail-row"><span class="label">BB Position</span><span class="value">${md.bb_position || '—'}</span></div>`;
  html += `<div class="detail-row"><span class="label">ADX</span><span class="value">${md.adx != null ? md.adx.toFixed(1) : '—'}</span></div>`;
  html += `<div class="detail-row"><span class="label">Volume Ratio</span><span class="value">${md.volume_ratio != null ? (md.volume_ratio*100).toFixed(0)+'%' : '—'}</span></div>`;

  // Fundamental scores
  if (fd.profitability != null || fd.valuation != null || fd.market != null) {
    html += `<h3 style="font-size:14px;font-weight:600;margin:12px 0 8px;color:var(--accent);">Fundamental</h3>`;
    if (fd.profitability != null) html += `<div class="detail-row"><span class="label">Profitability</span><span class="value">${fd.profitability}/${fd.profitability_max || 40}</span></div>`;
    if (fd.valuation != null) html += `<div class="detail-row"><span class="label">Valuation</span><span class="value">${fd.valuation}/${fd.valuation_max || 40}</span></div>`;
    if (fd.market != null) html += `<div class="detail-row"><span class="label">Market</span><span class="value">${fd.market}/${fd.market_max || 20}</span></div>`;
  }

  // Forecast score
  if (rc.forecast_score != null) {
    html += `<h3 style="font-size:14px;font-weight:600;margin:12px 0 8px;color:var(--accent);">Forecast</h3>`;
    html += `<div class="detail-row"><span class="label">Forecast Score</span><span class="value">${rc.forecast_score}/30</span></div>`;
    html += `<div class="detail-row"><span class="label">Forecast Proxy</span><span class="value">${rc.forecast_proxy != null ? rc.forecast_proxy : '—'}</span></div>`;
  }

  // Pipeline
  if (rc.pipeline) {
    html += `<h3 style="font-size:14px;font-weight:600;margin:12px 0 8px;color:var(--accent);">Pipeline Status</h3>`;
    for (const [k, v] of Object.entries(rc.pipeline)) {
      const cls = v === 'passed' ? 'text-green' : v === 'blocked' ? 'text-red' : v === 'pending' ? '' : '';
      html += `<div class="detail-row"><span class="label">${k}</span><span class="value ${cls}">${v || '—'}</span></div>`;
    }
  }

  document.getElementById('panelContent').innerHTML = html;
}

function closePanel() {
  document.getElementById('sidePanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// === Export ===
function exportCSV() {
  if (!filteredResults.length) return;
  const headers = ['Symbol', 'Score', 'Halal', 'Change%', 'MarketCap', 'Sector', 'RSI', 'Signal', 'Strategy'];
  const rows = filteredResults.map(r => [
    r.symbol, r.smart_score, r.is_halal, r.change_pct, r.market_cap, r.sector,
    (r.momentum_details||{}).rsi, r.signal, r.strategy
  ]);
  const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'halal-screener-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

// === Initial load: try cache first ===
async function loadCached() {
  const data = await apiGet(SCREENER_API + '?use_cache=true&max_results=50&add_forecast=true');
  if (data && data.results) {
    document.getElementById('loadingScreen').style.display = 'none';
    allResults = data.results || [];
    renderSummary(data);
    renderGateInfo(data);
    renderTable();
    updateTimestamp(data);
  } else {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('emptyState').style.display = '';
  }
}

loadCached();
</script>
