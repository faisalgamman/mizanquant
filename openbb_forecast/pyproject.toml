[tool.poetry]
name = "openbb-forecast"
version = "0.1.0"
description = "OpenBB extension for stock forecasting, RL trading agents, and walk-forward backtesting"
authors = ["OpenBB Forecast Contributors"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    {include = "openbb_forecast"},
    {include = "openbb_forecast/data"},
    {include = "openbb_forecast/models"},
    {include = "openbb_forecast/agents"},
    {include = "openbb_forecast/simulation"},
    {include = "openbb_forecast/risk"},
    {include = "openbb_forecast/backtesting"},
    {include = "openbb_forecast/schemas"},
]

[tool.poetry.dependencies]
python = ">=3.10"
torch = ">=2.0"
scikit-learn = ">=1.3"
xgboost = ">=2.0"
numpy = ">=1.24"
pandas = ">=2.0"
statsmodels = ">=0.14"

[tool.poetry.plugins."openbb_core_extension"]
forecast = "openbb_forecast.router:router"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
