<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Eyebrow labels</title>
<link rel="stylesheet" href="_base.css"></head><body><div class="card-wrap">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;background:var(--bg-surface);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:18px;">

  <div>
    <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Total return</div>
    <div class="mono" style="font-size:18px;font-weight:700;color:#4ade80;margin-top:6px;">$12.4K</div>
  </div>
  <div>
    <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Sharpe</div>
    <div class="mono" style="font-size:18px;font-weight:700;color:#e4e4ec;margin-top:6px;">1.84</div>
  </div>
  <div>
    <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Win rate</div>
    <div class="mono" style="font-size:18px;font-weight:700;color:#4ade80;margin-top:6px;">62%</div>
  </div>
  <div>
    <div style="font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Max drawdown</div>
    <div class="mono" style="font-size:18px;font-weight:700;color:#f87171;margin-top:6px;">−4.2%</div>
  </div>
</div>
<div style="font-size:11px;color:var(--text-muted);margin-top:10px;">Eyebrow = --text-xs · 10px · 600 · UPPERCASE · 0.5px tracking · --text-muted. The product's most-used label pattern.</div></div></body></html>
