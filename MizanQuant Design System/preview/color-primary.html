<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Primary — Warm Gold</title>
<link rel="stylesheet" href="_base.css"></head><body><div class="card-wrap">

  <div>
    <div style="height:88px;background:#c8963e;border-radius:8px;"></div>
    <div style="margin-top:8px;"><div style="font-weight:600;">accent</div><div class="mono muted">#c8963e</div></div>
  </div>
  <div>
    <div style="height:88px;background:#d4a853;border-radius:8px;"></div>

  <div>
    <div style="height:88px;background:rgba(200,150,62,0.18);border:1px solid rgba(200,150,62,0.10);border-radius:8px;"></div>

  </div>
  <div>
    <div style="height:88px;background:rgba(200,150,62,0.10);border:1px solid rgba(200,150,62,0.10);border-radius:8px;"></div>

  </div>
