<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Badges & signals</title>
<link rel="stylesheet" href="_base.css"></head><body><div class="card-wrap">
<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
  <span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;background:rgba(74,222,128,0.10);color:#4ade80;">▲ Strong buy</span>
  <span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;background:rgba(74,222,128,0.10);color:#4ade80;">Buy</span>
  <span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;background:rgba(251,191,36,0.10);color:#fbbf24;">◆ Wait</span>
  <span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;background:rgba(248,113,113,0.10);color:#f87171;">▼ Avoid</span>
  <span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;background:rgba(200,150,62,0.10);color:#c8963e;">Halal · pass</span>
  <span style="display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:12px;font-size:10px;font-weight:600;background:rgba(74,222,128,0.10);color:#4ade80;border:1px solid #4ade80;">Risk-on</span>
  <span style="display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:12px;font-size:10px;font-weight:600;background:rgba(251,191,36,0.10);color:#fbbf24;border:1px solid #fbbf24;">Caution</span>
  <span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;background:var(--bg-raised);color:var(--text-muted);border:1px solid rgba(255,255,255,0.06);">Idle</span>
  <span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;background:rgba(96,165,250,0.10);color:#60a5fa;">Live</span>
</div>
<div style="font-size:11px;color:var(--text-muted);margin-top:12px;">Square badge = enum/state (radius 3, 10px). Pill = gate/regime (radius 12, with border). Unicode arrows for direction.</div></div></body></html>
