<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Buttons</title>
<link rel="stylesheet" href="_base.css"></head><body><div class="card-wrap">
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
  <button style="padding:8px 16px;border-radius:5px;border:1px solid #c8963e;background:rgba(200,150,62,0.10);color:#c8963e;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">Run pipeline</button>
  <button style="padding:8px 16px;border-radius:5px;border:1px solid rgba(255,255,255,0.10);background:transparent;color:var(--text-primary);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;">Cancel</button>
  <button style="padding:8px 16px;border-radius:5px;border:none;background:#c8963e;color:#14141a;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">Send to paper trade</button>
  <button style="padding:8px 16px;border-radius:5px;border:1px solid rgba(74,222,128,0.30);background:rgba(74,222,128,0.10);color:#4ade80;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;"><i class="fas fa-play" style="font-size:10px;margin-right:6px;"></i>Run scan</button>
  <button style="padding:8px 16px;border-radius:5px;border:1px solid rgba(248,113,113,0.30);background:rgba(248,113,113,0.10);color:#f87171;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">Kill switch</button>
  <button style="padding:8px 16px;border-radius:5px;border:1px solid rgba(255,255,255,0.06);background:var(--bg-raised);color:var(--text-disabled);font-size:12px;font-weight:500;cursor:not-allowed;font-family:inherit;">Disabled</button>
</div>
<div style="font-size:11px;color:var(--text-muted);margin-top:12px;">Heights: 28px (sm) / 32px (md, default) / 36px (lg). Border-radius: 5px. Outline + dim-fill is the most common pattern.</div></div></body></html>
