<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Pipeline flow</title>
<link rel="stylesheet" href="_base.css"></head><body><div class="card-wrap">
<div style="background:var(--bg-surface);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:14px;">
  <div style="display:flex;align-items:center;justify-content:center;gap:0;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;">
        <div style="width:24px;height:24px;border-radius:50%;background:#4ade80;border:1.5px solid #4ade80;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;">✓</div>
        <div style="font-size:9px;text-align:center;color:var(--text-secondary);">Scan</div>
      </div><div style="width:24px;height:1.5px;background:#4ade80;margin-bottom:14px;"></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;">
        <div style="width:24px;height:24px;border-radius:50%;background:#4ade80;border:1.5px solid #4ade80;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;">✓</div>
        <div style="font-size:9px;text-align:center;color:var(--text-secondary);">Feature</div>
      </div><div style="width:24px;height:1.5px;background:#4ade80;margin-bottom:14px;"></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;">
        <div style="width:24px;height:24px;border-radius:50%;background:#4ade80;border:1.5px solid #4ade80;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;">✓</div>
        <div style="font-size:9px;text-align:center;color:var(--text-secondary);">Score</div>
      </div><div style="width:24px;height:1.5px;background:#4ade80;margin-bottom:14px;"></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;">
        <div style="width:24px;height:24px;border-radius:50%;background:#c8963e;border:1.5px solid #c8963e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;animation:pulse 1.2s ease-in-out infinite;">●</div>
        <div style="font-size:9px;text-align:center;color:var(--text-secondary);">Consensus</div>
      </div><div style="width:24px;height:1.5px;background:rgba(255,255,255,0.10);margin-bottom:14px;"></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;">
        <div style="width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.10);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;">5</div>
        <div style="font-size:9px;text-align:center;color:var(--text-muted);">Risk</div>
      </div><div style="width:24px;height:1.5px;background:rgba(255,255,255,0.10);margin-bottom:14px;"></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;">
        <div style="width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.10);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;">6</div>
        <div style="font-size:9px;text-align:center;color:var(--text-muted);">Execute</div>
      </div>
  </div>
  <style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}</style>
</div></div></body></html>
