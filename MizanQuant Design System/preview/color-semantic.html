<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Semantic — Directional</title>
<link rel="stylesheet" href="_base.css"></head><body><div class="card-wrap">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">

  <div>
    <div style="height:72px;background:#4ade80;border-radius:8px;"></div>
    <div style="height:24px;background:#4ade801a;border-radius:4px;margin-top:6px;"></div>
    <div style="margin-top:8px;"><div style="font-weight:600;color:#4ade80;">positive</div><div class="mono muted">#4ade80</div><div class="muted" style="font-size:10px;margin-top:2px;">buy / profit / pass</div></div>
  </div>
  <div>
    <div style="height:72px;background:#f87171;border-radius:8px;"></div>
    <div style="height:24px;background:#f871711a;border-radius:4px;margin-top:6px;"></div>
    <div style="margin-top:8px;"><div style="font-weight:600;color:#f87171;">negative</div><div class="mono muted">#f87171</div><div class="muted" style="font-size:10px;margin-top:2px;">sell / loss / fail</div></div>
  </div>
  <div>
    <div style="height:72px;background:#fbbf24;border-radius:8px;"></div>
    <div style="height:24px;background:#fbbf241a;border-radius:4px;margin-top:6px;"></div>
    <div style="margin-top:8px;"><div style="font-weight:600;color:#fbbf24;">warning</div><div class="mono muted">#fbbf24</div><div class="muted" style="font-size:10px;margin-top:2px;">wait / caution</div></div>
  </div>
  <div>
    <div style="height:72px;background:#60a5fa;border-radius:8px;"></div>
    <div style="height:24px;background:#60a5fa1a;border-radius:4px;margin-top:6px;"></div>
    <div style="margin-top:8px;"><div style="font-weight:600;color:#60a5fa;">info</div><div class="mono muted">#60a5fa</div><div class="muted" style="font-size:10px;margin-top:2px;">neutral metric</div></div>
  </div>
</div></div></body></html>
