<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Borders — 3 weights</title>
<link rel="stylesheet" href="_base.css"></head><body><div class="card-wrap">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">

  <div>
    <div style="height:88px;background:var(--bg-surface);border:1px solid rgba(255,255,255,0.04);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:11px;">border-subtle</div>
    <div style="margin-top:8px;"><div style="font-weight:600;">subtle</div><div class="mono muted">white · 4%</div><div class="muted" style="font-size:10px;margin-top:2px;">inner row dividers</div></div>
  </div>
  <div>
    <div style="height:88px;background:var(--bg-surface);border:1px solid rgba(255,255,255,0.06);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:11px;">border-default</div>
    <div style="margin-top:8px;"><div style="font-weight:600;">default</div><div class="mono muted">white · 6%</div><div class="muted" style="font-size:10px;margin-top:2px;">cards · table</div></div>
  </div>
  <div>
    <div style="height:88px;background:var(--bg-surface);border:1px solid rgba(255,255,255,0.10);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:11px;">border-strong</div>
    <div style="margin-top:8px;"><div style="font-weight:600;">strong</div><div class="mono muted">white · 10%</div><div class="muted" style="font-size:10px;margin-top:2px;">focus · selection</div></div>
  </div>
</div></div></body></html>
