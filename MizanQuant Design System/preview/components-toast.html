<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Toast — success / error</title>
<link rel="stylesheet" href="_base.css"></head><body><div class="card-wrap">
<div style="display:flex;flex-direction:column;gap:10px;">
  <div style="padding:10px 14px;background:var(--bg-surface);border:1px solid #4ade80;border-left:3px solid #4ade80;border-radius:6px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,0.4);max-width:380px;">
    <div style="font-weight:600;color:#4ade80;margin-bottom:2px;">Paper trade sent</div>
    <div style="color:var(--text-secondary);">AAPL · BUY · 5 shares @ $182.34 · halal</div>
  </div>
  <div style="padding:10px 14px;background:var(--bg-surface);border:1px solid #f87171;border-left:3px solid #f87171;border-radius:6px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,0.4);max-width:380px;">
    <div style="font-weight:600;color:#f87171;margin-bottom:2px;">Pipeline rejected</div>
    <div style="color:var(--text-secondary);">Guard: max-concurrent (5/5) — close a position first.</div>
  </div>
</div></div></body></html>
