<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Text — 4-tier ramp</title>
<link rel="stylesheet" href="_base.css"></head><body><div class="card-wrap">
<div style="background:var(--bg-surface);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:18px 20px;">

  <div style="display:flex;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
    <div style="color:#e4e4ec;font-size:18px;font-weight:600;width:200px;font-family:var(--font-display);">Sample text</div>
    <div style="flex:1;"><div style="color:#e4e4ec;font-weight:500;">text-primary</div></div>
    <div class="mono muted" style="font-size:11px;">#e4e4ec</div>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
    <div style="color:#9494a0;font-size:18px;font-weight:600;width:200px;font-family:var(--font-display);">Sample text</div>
    <div style="flex:1;"><div style="color:#9494a0;font-weight:500;">text-secondary</div></div>
    <div class="mono muted" style="font-size:11px;">#9494a0</div>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
    <div style="color:#5c5c6a;font-size:18px;font-weight:600;width:200px;font-family:var(--font-display);">Sample text</div>
    <div style="flex:1;"><div style="color:#5c5c6a;font-weight:500;">text-muted</div></div>
    <div class="mono muted" style="font-size:11px;">#5c5c6a</div>
  </div>
  <div style="display:flex;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
    <div style="color:#3c3c48;font-size:18px;font-weight:600;width:200px;font-family:var(--font-display);">Sample text</div>
    <div style="flex:1;"><div style="color:#3c3c48;font-weight:500;">text-disabled</div></div>
    <div class="mono muted" style="font-size:11px;">#3c3c48</div>
  </div>
</div></div></body></html>
